<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danglish — Danish to English, locally</title>
    <meta
      name="description"
      content="A local, streaming Danish-to-English translator that runs in under 2 GB of RAM."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e05a47'/%3E%3Ctext x='32' y='45' font-size='38' font-family='ui-sans-serif,system-ui' font-weight='700' text-anchor='middle' fill='white'%3ED%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0f14;
        --panel: #121720;
        --panel-2: #171e29;
        --line: #253041;
        --text: #e8edf5;
        --muted: #8b98ab;
        --faint: #5e6b7d;
        --accent: #e05a47;
        --accent-soft: #3a201d;
        --blue: #6aa9ff;
        --ok: #54c892;
        --warn: #e6b450;
        --bad: #ef6b6b;
        --radius: 18px;
        --mono: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background:
          radial-gradient(900px 500px at 12% -10%, rgba(224, 90, 71, 0.1), transparent 60%),
          radial-gradient(800px 480px at 96% 8%, rgba(106, 169, 255, 0.07), transparent 55%),
          var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px clamp(16px, 4vw, 40px);
        border-bottom: 1px solid var(--line);
        background: rgba(12, 15, 20, 0.72);
        backdrop-filter: blur(10px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
        min-width: 0;
      }

      .logo {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: linear-gradient(145deg, #f0705c, #c94433);
        color: white;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 21px;
        box-shadow: 0 6px 20px rgba(224, 90, 71, 0.22);
        flex: none;
      }

      h1 {
        margin: 0;
        font-size: 19px;
        letter-spacing: -0.02em;
        font-weight: 700;
      }

      .tagline {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .pill {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: #d6c2be;
        border: 1px solid #4a2d29;
        background: var(--accent-soft);
        border-radius: 999px;
        padding: 5px 9px;
        white-space: nowrap;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--faint);
        box-shadow: 0 0 0 3px rgba(94, 107, 125, 0.14);
      }

      .dot.is-online {
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(84, 200, 146, 0.14);
      }

      .dot.is-connecting {
        background: var(--warn);
        animation: pulse 1.4s ease-in-out infinite;
      }

      .dot.is-offline {
        background: var(--bad);
        box-shadow: 0 0 0 3px rgba(239, 107, 107, 0.14);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 16px clamp(16px, 4vw, 40px) 10px;
        min-height: 0;
        max-width: 1500px;
        width: 100%;
        margin: 0 auto;
      }

      .pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.018), transparent 120px),
          var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.16);
      }

      .pane-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        min-height: 52px;
      }

      .pane-title {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .flag {
        width: 17px;
        height: 12px;
        border-radius: 2px;
        display: inline-block;
        flex: none;
      }

      .flag.da {
        background: linear-gradient(90deg, #c8102e 0 28%, white 28% 36%, #c8102e 36%);
        position: relative;
      }

      .flag.da::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 44%;
        height: 16%;
        background: white;
      }

      .flag.en {
        background: #1f3b73;
        position: relative;
        overflow: hidden;
      }

      .flag.en::before,
      .flag.en::after {
        content: "";
        position: absolute;
        background: #f4f6fa;
      }

      .flag.en::before {
        left: 38%;
        top: 0;
        bottom: 0;
        width: 18%;
        transform: skewX(-14deg);
      }

      .flag.en::after {
        left: 0;
        right: 0;
        top: 41%;
        height: 18%;
      }

      .meta {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--faint);
      }

      textarea {
        flex: 1;
        width: 100%;
        min-height: 210px;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        padding: 20px 22px;
        font-family: inherit;
        font-size: clamp(17px, 1.35vw, 20px);
        line-height: 1.72;
        caret-color: var(--accent);
      }

      textarea::placeholder {
        color: var(--faint);
      }

      .output {
        flex: 1;
        min-height: 210px;
        overflow-y: auto;
        padding: 6px 22px 18px;
        scrollbar-width: thin;
        scrollbar-color: #334052 transparent;
      }

      .output::-webkit-scrollbar {
        width: 8px;
      }

      .output::-webkit-scrollbar-thumb {
        background: #334052;
        border-radius: 999px;
      }

      .pair {
        padding: 15px 0 16px;
        border-bottom: 1px solid rgba(37, 48, 65, 0.65);
        animation: rise 220ms ease-out;
      }

      .pair:last-child {
        border-bottom: 0;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .source {
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .target {
        margin: 0;
        color: var(--text);
        font-size: clamp(17px, 1.3vw, 19px);
        line-height: 1.65;
        text-wrap: pretty;
      }

      .is-partial {
        position: relative;
        padding-left: 13px;
        border-left: 2px solid var(--accent);
        border-bottom-color: transparent;
        animation: none;
      }

      .is-partial .source,
      .is-partial .target {
        color: #c3cbd8;
      }

      .is-partial .source {
        color: var(--faint);
      }

      .is-partial .target::after {
        content: "live";
        display: inline-block;
        margin-left: 9px;
        padding: 2px 6px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #f3a99d;
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        vertical-align: 2px;
        animation: pulse 1.6s ease-in-out infinite;
      }

      .empty {
        height: 100%;
        min-height: 210px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 10px;
        padding: 30px 20px;
        color: var(--muted);
      }

      .empty-mark {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 20px;
        color: var(--faint);
        margin-bottom: 2px;
      }

      .empty p {
        margin: 0;
        font-size: 14px;
        max-width: 300px;
        line-height: 1.55;
      }

      .empty .muted {
        color: var(--faint);
        font-size: 12px;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 12px 16px;
        border-top: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.08);
        flex-wrap: wrap;
      }

      button {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 550;
        border-radius: 9px;
        padding: 8px 12px;
        cursor: pointer;
        transition:
          background 140ms ease,
          border-color 140ms ease,
          transform 80ms ease;
      }

      button:hover {
        background: #1d2634;
        border-color: #34435a;
      }

      button:active {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }

      button.primary:hover {
        background: #ea6a57;
        border-color: #ea6a57;
      }

      button.ghost {
        background: transparent;
      }

      .spacer {
        flex: 1;
      }

      .hint {
        color: var(--faint);
        font-family: var(--mono);
        font-size: 10.5px;
        white-space: nowrap;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px clamp(16px, 4vw, 40px) 16px;
        color: var(--faint);
        font-size: 11px;
        flex-wrap: wrap;
      }

      footer .left {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      footer .sep {
        color: #354256;
      }

      .latency {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        min-width: 54px;
        text-align: right;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translate(-50%, 16px);
        background: #241a1a;
        border: 1px solid #5b2e2a;
        color: #f3c2bb;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 12.5px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 180ms ease,
          transform 180ms ease;
        z-index: 20;
        max-width: min(560px, calc(100vw - 32px));
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 820px) {
        header {
          padding: 14px 16px;
        }

        .tagline {
          display: none;
        }

        main {
          grid-template-columns: 1fr;
          padding: 12px 12px 6px;
          gap: 12px;
        }

        .pane {
          min-height: 340px;
        }

        textarea {
          min-height: 170px;
          padding: 17px;
        }

        .output {
          max-height: 46vh;
          padding: 4px 17px 14px;
        }

        .pane-head {
          padding: 11px 15px;
          min-height: 46px;
        }

        footer {
          padding: 8px 16px 14px;
        }

        .hint {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">D</div>
        <div>
          <h1>Danglish</h1>
          <p class="tagline">Streaming Danish → English, entirely on this machine.</p>
        </div>
        <span class="pill">DA → EN</span>
      </div>
      <div class="header-right">
        <div class="status" role="status" aria-live="polite">
          <span class="dot is-connecting" id="dot"></span>
          <span id="statusText">connecting…</span>
        </div>
      </div>
    </header>

    <main>
      <section class="pane" aria-labelledby="da-title">
        <div class="pane-head">
          <h2 class="pane-title" id="da-title">
            <span class="flag da" aria-hidden="true"></span>
            Danish
          </h2>
          <span class="meta" id="charCount">0 tegn</span>
        </div>
        <label for="input" class="sr-only" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Danish text</label>
        <textarea
          id="input"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          placeholder="Skriv eller indsæt dansk tekst…"
          aria-describedby="inputHint"
        ></textarea>
        <div class="controls">
          <button class="ghost" id="clearBtn" type="button">Clear</button>
          <button class="ghost" id="exampleBtn" type="button">Load example</button>
          <span class="spacer"></span>
          <span class="hint" id="inputHint">⌘/Ctrl + Enter to finish</span>
          <button class="primary" id="flushBtn" type="button">Translate now</button>
        </div>
      </section>

      <section class="pane" aria-labelledby="en-title">
        <div class="pane-head">
          <h2 class="pane-title" id="en-title">
            <span class="flag en" aria-hidden="true"></span>
            English
          </h2>
          <span class="meta latency" id="latency">—</span>
        </div>
        <div class="output" id="output" aria-live="polite"></div>
        <div class="controls">
          <button class="ghost" id="copyBtn" type="button">Copy translation</button>
          <span class="spacer"></span>
          <span class="hint" id="modelName">loading model…</span>
        </div>
      </section>
    </main>

    <footer>
      <div class="left">
        <span>Local-first.</span>
        <span class="sep">·</span>
        <span>No text leaves this machine.</span>
      </div>
      <div class="left">
        <span id="rssValue"></span>
        <span class="sep">·</span>
        <span>Open source · Apache-2.0</span>
      </div>
    </footer>

    <div class="toast" id="toast" role="alert"></div>

    <script>
      "use strict";

      const $ = (id) => document.getElementById(id);
      const els = {
        input: $("input"),
        output: $("output"),
        dot: $("dot"),
        statusText: $("statusText"),
        charCount: $("charCount"),
        latency: $("latency"),
        modelName: $("modelName"),
        rssValue: $("rssValue"),
        clearBtn: $("clearBtn"),
        exampleBtn: $("exampleBtn"),
        flushBtn: $("flushBtn"),
        copyBtn: $("copyBtn"),
        toast: $("toast"),
      };

      const SAMPLE =
        "God morgen! Jeg hedder Anna, og jeg bor i Aarhus. " +
        "Jeg arbejder på et lille bibliotek, hvor vi hjælper elever med deres projekter. " +
        "Hvordan har du det i dag?";

      const state = {
        socket: null,
        ready: false,
        finals: [],
        partial: null,
        lastSent: "",
        retry: 0,
        retryTimer: null,
        closed: false,
      };

      function setStatus(kind, text) {
        els.dot.className = "dot is-" + kind;
        els.statusText.textContent = text;
      }

      function send(payload) {
        if (state.socket && state.socket.readyState === WebSocket.OPEN) {
          state.socket.send(JSON.stringify(payload));
        }
      }

      function scheduleReconnect() {
        clearTimeout(state.retryTimer);
        const delay = Math.min(5000, 700 * Math.pow(1.6, state.retry));
        state.retry += 1;
        state.retryTimer = setTimeout(connect, delay);
      }

      function connect() {
        clearTimeout(state.retryTimer);
        setStatus("connecting", "connecting…");
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        let socket;
        try {
          socket = new WebSocket(`${protocol}//${location.host}/ws/translate`);
        } catch (error) {
          scheduleReconnect();
          return;
        }
        state.socket = socket;

        socket.addEventListener("open", () => {
          state.retry = 0;
          setStatus("connecting", "loading model…");
        });

        socket.addEventListener("message", (event) => {
          let message;
          try {
            message = JSON.parse(event.data);
          } catch (error) {
            return;
          }
          handleMessage(message);
        });

        socket.addEventListener("close", () => {
          state.ready = false;
          setStatus("offline", "offline");
          if (!state.closed) scheduleReconnect();
        });

        socket.addEventListener("error", () => {
          try {
            socket.close();
          } catch (error) {
            /* ignore */
          }
        });
      }

      function handleMessage(message) {
        switch (message.type) {
          case "ready":
            state.ready = true;
            setStatus("online", message.mock ? "online · mock" : "online · local");
            els.modelName.textContent = message.mock
              ? "mock backend"
              : `${message.model} · ${message.compute_type}`;
            els.rssValue.textContent =
              typeof message.rss_mb === "number" ? `RSS ${Math.round(message.rss_mb)} MB` : "";
            syncInput();
            break;
          case "final":
            state.finals.push({
              source: message.source,
              target: message.target,
            });
            state.partial = null;
            updateLatency(message.latency_ms);
            render();
            break;
          case "partial":
            state.partial = { source: message.source, target: message.target };
            updateLatency(message.latency_ms);
            render();
            break;
          case "reset":
            state.finals = [];
            state.partial = null;
            render();
            break;
          case "error":
            showToast(message.message || "translation failed");
            break;
          default:
            break;
        }
      }

      function syncInput() {
        const value = els.input.value;
        state.finals = [];
        state.partial = null;
        state.lastSent = "";
        render();
        send({ type: "reset" });
        if (value) send({ type: "delta", text: value });
        state.lastSent = value;
      }

      function updateLatency(value) {
        if (typeof value !== "number" || !Number.isFinite(value)) return;
        els.latency.textContent = `${Math.round(value)} ms`;
      }

      function makePair(item, partial) {
        const article = document.createElement("article");
        article.className = partial ? "pair is-partial" : "pair";

        const source = document.createElement("p");
        source.className = "source";
        source.textContent = item.source;

        const target = document.createElement("p");
        target.className = "target";
        target.textContent = item.target;

        article.append(source, target);
        return article;
      }

      function emptyState() {
        const wrap = document.createElement("div");
        wrap.className = "empty";
        wrap.innerHTML =
          '<div class="empty-mark" aria-hidden="true">EN</div>' +
          "<p>Start typing Danish, or load the example.</p>" +
          '<p class="muted">Complete sentences are translated as you type. The sentence in progress gets a live preview.</p>';
        return wrap;
      }

      function render() {
        els.output.replaceChildren();
        if (state.finals.length === 0 && state.partial === null) {
          els.output.appendChild(emptyState());
          return;
        }
        for (const item of state.finals) {
          els.output.appendChild(makePair(item, false));
        }
        if (state.partial) {
          els.output.appendChild(makePair(state.partial, true));
        }
        els.output.scrollTop = els.output.scrollHeight;
      }

      function onInput() {
        const value = els.input.value;
        updateCount();
        if (!state.ready) return;

        if (value.startsWith(state.lastSent)) {
          const delta = value.slice(state.lastSent.length);
          if (delta) send({ type: "delta", text: delta });
        } else {
          // Editing earlier text: restart the stream with the full buffer.
          state.finals = [];
          state.partial = null;
          render();
          send({ type: "reset" });
          if (value) send({ type: "delta", text: value });
        }
        state.lastSent = value;
      }

      function updateCount() {
        const length = els.input.value.length;
        els.charCount.textContent = `${length} tegn`;
      }

      function flushNow() {
        if (!state.ready) return;
        send({ type: "flush" });
        els.input.focus();
      }

      function clearAll() {
        els.input.value = "";
        state.lastSent = "";
        state.finals = [];
        state.partial = null;
        send({ type: "reset" });
        render();
        updateCount();
        els.latency.textContent = "—";
        els.input.focus();
      }

      function loadExample() {
        els.input.value = SAMPLE;
        updateCount();
        if (state.ready) {
          state.lastSent = "";
          state.finals = [];
          state.partial = null;
          render();
          send({ type: "reset" });
          send({ type: "delta", text: SAMPLE });
          state.lastSent = SAMPLE;
        }
        els.input.focus();
        els.input.setSelectionRange(SAMPLE.length, SAMPLE.length);
      }

      async function copyTranslation() {
        const pieces = state.finals.map((item) => item.target);
        if (state.partial) pieces.push(state.partial.target);
        const text = pieces.filter(Boolean).join(" ");
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          flashButton(els.copyBtn, "Copied");
        } catch (error) {
          const area = document.createElement("textarea");
          area.value = text;
          document.body.appendChild(area);
          area.select();
          try {
            document.execCommand("copy");
            flashButton(els.copyBtn, "Copied");
          } catch (fallbackError) {
            showToast("Copy failed; select the text manually.");
          } finally {
            area.remove();
          }
        }
      }

      function flashButton(button, label) {
        const original = button.textContent;
        button.textContent = label;
        button.disabled = true;
        setTimeout(() => {
          button.textContent = original;
          button.disabled = false;
        }, 1200);
      }

      let toastTimer = null;
      function showToast(message) {
        els.toast.textContent = message;
        els.toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => els.toast.classList.remove("show"), 4200);
      }

      els.input.addEventListener("input", onInput);
      els.input.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          event.preventDefault();
          flushNow();
        }
      });
      els.clearBtn.addEventListener("click", clearAll);
      els.exampleBtn.addEventListener("click", loadExample);
      els.flushBtn.addEventListener("click", flushNow);
      els.copyBtn.addEventListener("click", copyTranslation);

      render();
      updateCount();
      connect();
    </script>
  </body>
</html>
