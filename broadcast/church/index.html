<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0e0c0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Holstebro Pinsekirke</title>
  <style>
    :root {
      --bg: #0e0c0a;
      --card: #181411;
      --border: #2e261f;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --text: #faf6f0;
      --muted: #8c7f70;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 24px;
      background-color: #0e0c0a;
      background-image: radial-gradient(circle at 50% 0%, #211b15 0%, #0e0c0a 75%);
      color: #faf6f0;
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100vh;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
    }

    .sanctuary-card {
      width: 100%;
      max-width: 380px;
      background-color: #181411;
      border: 1px solid #2e261f;
      border-radius: 28px;
      padding: 40px 28px 36px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(212, 175, 55, 0.15);
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      text-align: center;
    }

    .brand {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      margin-bottom: 36px;
    }

    .cross-icon {
      width: 36px;
      height: 48px;
      stroke: #d4af37;
      stroke-width: 2.2;
      fill: none;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 1.65rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #f3e5ab;
    }

    .action-btn {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 2px solid #d4af37;
      background-color: #1a1510;
      background-image: radial-gradient(circle at 50% 30%, #2a2219 0%, #14100c 100%);
      color: #f3e5ab;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      margin-bottom: 36px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.12);
      transition: transform 0.12s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .action-btn:active {
      -webkit-transform: scale(0.96);
      transform: scale(0.96);
    }

    .action-btn.active {
      border-color: #f3e5ab;
      background-color: #b5891c;
      background-image: radial-gradient(circle at 50% 30%, #c89d28 0%, #8a6810 100%);
      color: #0e0c0a;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.45);
    }

    .meter-wrap {
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .meter-header {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8c7f70;
      margin-bottom: 8px;
    }

    .meter-track {
      width: 100%;
      height: 14px;
      background-color: #0b0908;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #2e261f;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background-color: #d4af37;
      background-image: linear-gradient(90deg, #8a6810 0%, #d4af37 65%, #f3e5ab 100%);
      border-radius: 999px;
      transition: width 0.06s linear;
    }
  </style>
</head>
<body>
  <div class="sanctuary-card">
    <div class="brand">
      <svg class="cross-icon" viewBox="0 0 24 32">
        <line x1="12" y1="2" x2="12" y2="30" stroke-linecap="round"/>
        <line x1="4" y1="10" x2="20" y2="10" stroke-linecap="round"/>
      </svg>
      <h1>Holstebro Pinsekirke</h1>
    </div>

    <button id="listenBtn" class="action-btn" type="button">Listen</button>

    <div class="meter-wrap">
      <div class="meter-header">
        <span>dB</span>
        <span id="dbValue">-60 dB</span>
      </div>
      <div class="meter-track">
        <div id="meterFill" class="meter-fill"></div>
      </div>
    </div>
  </div>

  <audio id="remoteAudio" playsinline webkit-playsinline autoplay></audio>

  <script>
    (function () {
      "use strict";

      var listenBtn = document.getElementById("listenBtn");
      var meterFill = document.getElementById("meterFill");
      var dbValue = document.getElementById("dbValue");
      var remoteAudio = document.getElementById("remoteAudio");

      var isListening = false;
      var usingFallback = false;
      var pc = null;
      var audioCtx = null;
      var analyserNode = null;
      var sourceNode = null;
      var meterAnimId = null;
      var reconnectTimerId = null;
      var fallbackTimerId = null;
      var wakeLockSentinel = null;
      var serverMeterPct = 0;

      function acquireWakeLock() {
        if (navigator.wakeLock && navigator.wakeLock.request && isListening) {
          try {
            navigator.wakeLock.request("screen").then(function (s) {
              wakeLockSentinel = s;
            }).catch(function () {});
          } catch (_) {}
        }
      }

      function releaseWakeLock() {
        if (wakeLockSentinel && wakeLockSentinel.release) {
          try { wakeLockSentinel.release(); } catch (_) {}
          wakeLockSentinel = null;
        }
      }

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible" && isListening) {
          acquireWakeLock();
          if (audioCtx && audioCtx.state === "suspended" && audioCtx.resume) {
            try { audioCtx.resume(); } catch (_) {}
          }
          if (remoteAudio && remoteAudio.paused) {
            try { remoteAudio.play(); } catch (_) {}
          }
        }
      });

      function setupMediaSession() {
        try {
          if ("mediaSession" in navigator && window.MediaMetadata) {
            navigator.mediaSession.metadata = new MediaMetadata({
              title: "Holstebro Pinsekirke",
              artist: "Live Audio"
            });
          }
        } catch (_) {}
      }

      function updateMeterUI(pct) {
        if (!isListening) {
          meterFill.style.width = "0%";
          dbValue.textContent = "-60 dB";
          return;
        }
        var clamped = Math.max(0, Math.min(100, Math.round(pct)));
        var db = Math.round(-60 + (clamped / 100) * 60);
        meterFill.style.width = clamped + "%";
        dbValue.textContent = db + " dB";
      }

      function startLevelMeter() {
        var dataArray = analyserNode ? new Uint8Array(analyserNode.frequencyBinCount) : null;

        function renderMeter() {
          if (!isListening) {
            updateMeterUI(0);
            return;
          }
          var localPct = 0;
          if (analyserNode && dataArray && !usingFallback) {
            try {
              analyserNode.getByteTimeDomainData(dataArray);
              var sumSquares = 0;
              for (var i = 0; i < dataArray.length; i++) {
                var norm = (dataArray[i] - 128) / 128;
                sumSquares += norm * norm;
              }
              var rms = Math.sqrt(sumSquares / dataArray.length);
              if (rms > 0.0005) {
                var db = Math.max(-60, Math.min(0, 20 * (Math.log(rms) / Math.LN10)));
                localPct = Math.round(((db + 60) / 60) * 100);
              }
            } catch (_) {}
          }
          // Use whichever is higher between local WebAudio analyser and server meter
          // (on older iOS Safari, createMediaStreamSource on remote WebRTC streams returns 0)
          updateMeterUI(Math.max(localPct, serverMeterPct));
          meterAnimId = window.requestAnimationFrame ? requestAnimationFrame(renderMeter) : setTimeout(renderMeter, 60);
        }

        if (meterAnimId && window.cancelAnimationFrame) cancelAnimationFrame(meterAnimId);
        renderMeter();
      }

      function attachStreamToAudio(stream) {
        try {
          if ("srcObject" in remoteAudio) {
            remoteAudio.srcObject = stream;
          } else {
            remoteAudio.src = window.URL.createObjectURL(stream);
          }
          // Keep remoteAudio unmuted so iOS Safari plays through the native hardware media pipeline
          // and continues playing when the user locks their phone screen
          remoteAudio.muted = false;
          remoteAudio.volume = 1.0;
          var playPromise = remoteAudio.play();
          if (playPromise && playPromise.catch) {
            playPromise.catch(function () {});
          }
        } catch (_) {}

        if (audioCtx && audioCtx.createMediaStreamSource) {
          try {
            if (sourceNode) {
              try { sourceNode.disconnect(); } catch (_) {}
            }
            sourceNode = audioCtx.createMediaStreamSource(stream);
            analyserNode = audioCtx.createAnalyser();
            analyserNode.fftSize = 256;
            sourceNode.connect(analyserNode);
          } catch (_) {}
        }

        startLevelMeter();
      }

      function startHTTPFallbackStream() {
        if (!isListening) return;
        usingFallback = true;
        if (pc) {
          try { pc.close(); } catch (_) {}
          pc = null;
        }
        try {
          remoteAudio.srcObject = null;
        } catch (_) {}
        remoteAudio.muted = false;
        remoteAudio.volume = 1.0;
        remoteAudio.src = "/stream.mp3?t=" + new Date().getTime();
        fallbackLastTime = -1;
        fallbackStuckChecks = 0;
        try {
          var p = remoteAudio.play();
          if (p && p.catch) p.catch(function () {});
        } catch (_) {}
        startLevelMeter();
      }

      // MP3 fallback watchdog. If the MP3 stream breaks (Wi-Fi drop, laptop server
      // restarted) the player stops advancing and nothing else would ever restart it:
      // the listener would sit in silence until they pressed Stop and Listen again.
      // The server sends silence frames while muted, so a healthy stream always
      // advances. 3 checks x 2 s = 6 s of no progress triggers a reload; that is
      // longer than the initial buffering of a 96 kbps MP3 on a LAN (well under 1 s).
      var fallbackLastTime = -1;
      var fallbackStuckChecks = 0;

      function restartFallbackSoon() {
        if (!isListening || !usingFallback || reconnectTimerId) return;
        reconnectTimerId = setTimeout(function () {
          reconnectTimerId = null;
          if (isListening && usingFallback) startHTTPFallbackStream();
        }, 1500);
      }

      remoteAudio.addEventListener("ended", restartFallbackSoon);

      setInterval(function () {
        // Do not fight a pause the listener chose (e.g. lock-screen pause button).
        if (!isListening || !usingFallback || remoteAudio.paused) {
          fallbackLastTime = -1;
          fallbackStuckChecks = 0;
          return;
        }
        var t = remoteAudio.currentTime || 0;
        if (t === fallbackLastTime) {
          fallbackStuckChecks++;
          if (fallbackStuckChecks >= 3) {
            fallbackStuckChecks = 0;
            restartFallbackSoon();
          }
        } else {
          fallbackStuckChecks = 0;
        }
        fallbackLastTime = t;
      }, 2000);

      function applyLowLatencyReceiverHints(receiver) {
        if (!receiver) return;
        // 70ms jitter buffer target absorbs Wi-Fi / OS scheduling jitter without underruns
        try {
          if ("playoutDelayHint" in receiver) receiver.playoutDelayHint = 0.07;
          if ("jitterBufferTarget" in receiver) receiver.jitterBufferTarget = 70;
        } catch (_) {}
      }

      function scheduleReconnect() {
        if (!isListening || usingFallback || reconnectTimerId) return;
        reconnectTimerId = setTimeout(function () {
          reconnectTimerId = null;
          if (isListening && !usingFallback) connectWebRTC();
        }, 1500);
      }

      function connectWebRTC() {
        if (!isListening) return;

        var search = window.location.search || "";
        if (search.indexOf("mode=mp3") !== -1 || search.indexOf("fallback=1") !== -1) {
          startHTTPFallbackStream();
          return;
        }

        var PeerConnectionClass = window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection;
        if (!PeerConnectionClass) {
          startHTTPFallbackStream();
          return;
        }

        if (pc) {
          try { pc.close(); } catch (_) {}
          pc = null;
        }

        try {
          pc = new PeerConnectionClass({ iceServers: [] });
        } catch (_) {
          startHTTPFallbackStream();
          return;
        }

        // If WebRTC does not reach connected state within 4 seconds (e.g. very old iOS),
        // seamlessly switch to the live HTTP MP3 audio stream
        if (fallbackTimerId) clearTimeout(fallbackTimerId);
        fallbackTimerId = setTimeout(function () {
          if (isListening && !usingFallback && (!pc || (pc.iceConnectionState !== "connected" && pc.iceConnectionState !== "completed"))) {
            startHTTPFallbackStream();
          }
        }, 4000);

        var offerOptions = null;
        if (typeof pc.addTransceiver === "function") {
          try {
            var transceiver = pc.addTransceiver("audio", { direction: "recvonly" });
            if (transceiver && transceiver.receiver) {
              applyLowLatencyReceiverHints(transceiver.receiver);
            }
          } catch (_) {
            offerOptions = { offerToReceiveAudio: true, offerToReceiveVideo: false };
          }
        } else {
          offerOptions = { offerToReceiveAudio: true, offerToReceiveVideo: false };
        }

        pc.ontrack = function (event) {
          if (event.receiver) applyLowLatencyReceiverHints(event.receiver);
          var stream = (event.streams && event.streams[0]) ? event.streams[0] : new MediaStream([event.track]);
          attachStreamToAudio(stream);
        };

        pc.onaddstream = function (event) {
          if (event && event.stream) {
            attachStreamToAudio(event.stream);
          }
        };

        pc.oniceconnectionstatechange = function () {
          if (!pc) return;
          var st = pc.iceConnectionState;
          if (st === "connected" || st === "completed") {
            if (fallbackTimerId) {
              clearTimeout(fallbackTimerId);
              fallbackTimerId = null;
            }
            if (reconnectTimerId) {
              clearTimeout(reconnectTimerId);
              reconnectTimerId = null;
            }
          } else if (st === "disconnected" || st === "failed" || st === "closed") {
            scheduleReconnect();
          }
        };

        pc.createOffer(offerOptions).then(function (offer) {
          return pc.setLocalDescription(offer);
        }).then(function () {
          var xhr = new XMLHttpRequest();
          xhr.open("POST", "/whep", true);
          xhr.setRequestHeader("Content-Type", "application/json");
          xhr.timeout = 3500;
          xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                var answer = JSON.parse(xhr.responseText);
                var SessionDesc = window.RTCSessionDescription || window.webkitRTCSessionDescription;
                pc.setRemoteDescription(new SessionDesc(answer)).catch(function () {
                  scheduleReconnect();
                });
              } catch (_) {
                scheduleReconnect();
              }
            } else {
              scheduleReconnect();
            }
          };
          xhr.onerror = function () { scheduleReconnect(); };
          xhr.ontimeout = function () { scheduleReconnect(); };
          xhr.send(JSON.stringify({
            type: pc.localDescription.type,
            sdp: pc.localDescription.sdp
          }));
        }).catch(function () {
          startHTTPFallbackStream();
        });
      }

      function stopListening() {
        isListening = false;
        usingFallback = false;
        if (fallbackTimerId) {
          clearTimeout(fallbackTimerId);
          fallbackTimerId = null;
        }
        if (reconnectTimerId) {
          clearTimeout(reconnectTimerId);
          reconnectTimerId = null;
        }
        if (meterAnimId) {
          if (window.cancelAnimationFrame) cancelAnimationFrame(meterAnimId);
          clearTimeout(meterAnimId);
          meterAnimId = null;
        }
        if (pc) {
          try { pc.close(); } catch (_) {}
          pc = null;
        }
        try {
          remoteAudio.pause();
          remoteAudio.srcObject = null;
          remoteAudio.removeAttribute("src");
          remoteAudio.load();
        } catch (_) {}
        updateMeterUI(0);
        listenBtn.classList.remove("active");
        listenBtn.textContent = "Listen";
        releaseWakeLock();
      }

      function toggleListening() {
        if (isListening) {
          stopListening();
          return;
        }

        isListening = true;
        usingFallback = false;
        listenBtn.classList.add("active");
        listenBtn.textContent = "Stop";

        try {
          var AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass && !audioCtx) {
            audioCtx = new AudioContextClass();
          }
          if (audioCtx && audioCtx.state === "suspended" && audioCtx.resume) {
            audioCtx.resume();
          }
        } catch (_) {}

        try {
          remoteAudio.muted = false;
          var p = remoteAudio.play();
          if (p && p.catch) p.catch(function () {});
        } catch (_) {}

        setupMediaSession();
        acquireWakeLock();
        startLevelMeter();
        connectWebRTC();
      }

      listenBtn.addEventListener("click", toggleListening);

      // Poll server audio level every 250ms so the dB meter works even on older iPhones
      setInterval(function () {
        if (!isListening) return;
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "/stats", true);
        xhr.timeout = 1000;
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4 && xhr.status === 200) {
            try {
              var st = JSON.parse(xhr.responseText);
              serverMeterPct = st.muted ? 0 : (st.audio_level_pct || 0);
            } catch (_) {}
          }
        };
        xhr.send();
      }, 250);
    })();
  </script>
</body>
</html>
